{{- define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">{{ .Description }}</div>
    {{- end }}
  </header>
  <div class="post-content md-content">
    {{ .Content }}

    {{- if hugo.Data.friends }}
    <div class="friends-grid">
      {{- range hugo.Data.friends }}
      <a class="friend-card" href="{{ .url }}" target="_blank" rel="noopener">
        <img class="friend-avatar" src="{{ .avatar }}" alt="{{ .name }}" loading="lazy">
        <div class="friend-info">
          <div class="friend-name">{{ .name }}</div>
          {{- if .description }}
          <div class="friend-desc">{{ .description }}</div>
          {{- end }}
        </div>
      </a>
      {{- end }}
    </div>
    {{- else }}
    <p style="color: var(--secondary);">暂无友链，欢迎交换！</p>
    {{- end }}
  </div>
</article>
{{- end }}
